      h1 {
        text-align: center;

      iframe {
        border-style: none;
        border-radius: 20px;
        margin: 20px;
      }

  <body>

    ></iframe>
    <!--margin은 간격 띄울 때도 쓰임.-->
    <iframe name="right" width="1000px" height="550px"></iframe>
  </body>
