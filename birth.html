<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>birth</title>
    <style>
      body {
        background-color: azure;
      }
      summary {
        font-size: 20px;
        font-weight: bold;
      }
      .photo {
        font-style: italic;
        font-size: 13px;
      }
      .birth:hover .miracle {
        font-size: 20px;
        color: gold;
        font-weight: bold;
      }
      .birth:hover .sayings {
        background-color: yellow;
        color: darkgoldenrod;
        font-weight: bold;
      }
      .birth:hover .cry {
        color: darkblue;
      }
      .cry:hover {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h2>출생</h2>
    <progress value="0.1" max="22"></progress>
    <hr />
    <img
      src="자소이미지/첫컴퓨터.jpg"
      alt="인생 첫(?) 컴퓨터"
      width="300px"
      height="225px"
    /><br /><span class="photo">
      아기 때인 거 보면, 저 컴퓨터가 내 인생의 첫 컴퓨터 같다.</span
    ><br /><br />
    <details>
      <summary>주요 연표</summary>
      2002년: 9월 6일 출생
    </details>
    <br />
    <details>
      <summary>출생 관련 썰</summary>
      <span class="birth">
        당시 엄마께서 몸이 아프셨었기에, 의사께서 날
        <span class="miracle">"기적의 아이"</span>라고 부르셨다. 지금도 엄마께선
        틈만 나면 이걸 강조하신다.<br />
        성인이 된 지금은 아기 시절의 기억이 없지만, 엄마의
        <span class="sayings">증언(?)</span> 덕에 얼추 알 수 있다. 100일 전까지
        <span class="cry">밤에 자다가 틈만 나면 울었다</span>던지...
      </span>
    </details>
  </body>
</html>
